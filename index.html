<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEXDESK PRO - Institutional Options Flow</title>
    <!-- استدعاء مكتبة الشارت -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #07090e; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }
        
        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a2332; padding-bottom: 15px; margin-bottom: 20px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-area h1 { margin: 0; font-size: 24px; font-weight: 800; color: #00f0ff; letter-spacing: 0.5px; text-shadow: 0 0 15px rgba(0,240,255,0.3); }
        .badge { background: linear-gradient(135deg, #0078ff, #00f0ff); color: #0b0f17; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; }
        
        .live-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #64748b; background: #111726; padding: 6px 12px; border: 1px solid #1d293d; border-radius: 20px; }
        .pulse-dot { width: 8px; height: 8px; background-color: #00e676; border-radius: 50%; box-shadow: 0 0 8px #00e676; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Tickers Row */
        .tickers-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .ticker-card { background: #111726; border: 1px solid #1d293d; border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.2s ease; }
        .ticker-card:hover { border-color: #00f0ff55; transform: translateY(-2px); }
        .ticker-card.active { border-color: #00f0ff; background: linear-gradient(145deg, #162035, #111726); box-shadow: 0 0 15px rgba(0,240,255,0.1); }
        .symbol { font-weight: 700; font-size: 15px; color: #fff; }
        .price { font-size: 15px; font-weight: 600; font-family: monospace; color: #f8fafc; }
        .positive { color: #00e676; font-weight: 600; } 
        .negative { color: #ff1744; font-weight: 600; }

        /* Analytics Grid */
        .analytics-grid { display: grid; grid-template-columns: 2.2fr 1fr; gap: 20px; }
        .panel { background: #111726; border: 1px solid #1d293d; border-radius: 8px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 12px; }
        .levels-container { display: flex; gap: 8px; flex-wrap: wrap; }
        .level-tag { background: #162035; padding: 6px 10px; border-radius: 6px; border: 1px solid #2d3f5e; font-size: 11px; font-weight: 500; color: #94a3b8; }
        .level-tag span { color: #00f0ff; font-weight: 700; font-family: monospace; }
        
        /* Metric Switcher Buttons */
        .metric-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #1d293d; padding-bottom: 12px; }
        .metric-buttons { display: flex; gap: 6px; }
        .metric-buttons button { background: #162035; border: 1px solid #2d3f5e; color: #94a3b8; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; transition: all 0.2s; }
        .metric-buttons button:hover { border-color: #00f0ff; color: #fff; }
        .metric-buttons button.active { background: #00f0ff; color: #07090e; border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.3); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #1d293d; }
        th { color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
        tr:hover td { background: rgba(255,255,255,0.01); }

        /* Responsive */
        @media (max-width: 1024px) {
            .analytics-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo-area">
            <h1>GEXDESK</h1>
            <span class="badge">PRO TERMINAL</span>
        </div>
        <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span id="last-update">LIVE AUTO-FEED: Connecting...</span>
        </div>
    </header>

    <!-- Tickers Bar -->
    <div id="tickers-row" class="tickers-row"></div>

    <div class="analytics-grid">
        <!-- Chart Panel -->
        <div class="panel">
            <div class="chart-header">
                <h3 id="chart-title" style="margin:0; font-size:14px; color:#f8fafc; font-weight: 600;">SPY - GREEKS & OPTIONS FLOW</h3>
                <div id="key-levels" class="levels-container"></div>
            </div>
            
            <div class="metric-toolbar">
                <div class="metric-buttons">
                    <button onclick="setMetric('gex')" class="active">GEX (Gamma)</button>
                    <button onclick="setMetric('dex')">DEX (Delta)</button>
                    <button onclick="setMetric('vanna')">Vanna</button>
                </div>
                <div style="font-size: 11px; color: #64748b;">Values in Millions ($M)</div>
            </div>

            <div style="position: relative; height: 380px; width: 100%;">
                <canvas id="gexChart"></canvas>
            </div>
        </div>

        <!-- Expirations Table Panel -->
        <div class="panel">
            <h3 style="margin:0 0 15px 0; font-size:13px; color:#f8fafc; font-weight: 600; letter-spacing: 0.3px;">0DTE & CALENDAR CHAIN</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Volume</th>
                        <th>Open Int</th>
                        <th>Net GEX</th>
                        <th>C/P Ratio</th>
                    </tr>
                </thead>
                <tbody id="exp-tbody">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
            <div style="text-align: right; font-size: 10px; color: #475569; margin-top: 20px; font-weight: 500;">Institutional Analytics Engine v2.5</div>
        </div>
    </div>

    <!-- Script File -->
    <script src="js/script.js"></script>
</body>
</html>
