<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEXDESK - Live Options & Greeks Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- استدعاء مكتبة Chart.js للرسوم البيانية التفاعلية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="top-bar">
        <h1>GEXDESK <span class="badge">Pro Interactive Greeks</span></h1>
        <div id="last-update">Last Updated: Loading...</div>
    </header>

    <main class="dashboard-container">
        <!-- تيكرز السوق -->
        <section class="tickers-grid" id="tickers-grid">
            <!-- سيتم تعبئتها أوتوماتيكياً -->
        </section>

        <!-- قسم الرسوم البيانية التفاعلية -->
        <section class="analytics-section">
            <div class="panel chart-panel">
                <h3 id="chart-title">Select a Ticker to View GEX & DEX Profile</h3>
                <div class="canvas-container">
                    <canvas id="gexChart"></canvas>
                </div>
            </div>
            
            <div class="panel">
                <h3>0DTE & Calendar Expirations</h3>
                <div id="expiration-list" class="exp-box">
                    <span>Awaiting selection...</span>
                </div>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
